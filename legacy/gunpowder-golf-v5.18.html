                                                            </div>
                                                            <button
                                                                onClick={() => {
                                                                    addPlayerToTeamLate(addLatePlayerTeamId, latePlayerSelected.playerId, 'back', [12, 17]);
                                                                    setShowAddLatePlayer(false);
                                                                    setAddLatePlayerTeamId(null);
                                                                    setLatePlayerSelected(null);
                                                                    setLatePlayerStep(1);
                                                                    setLatePlayerPayment(null);
                                                                    alert(`${latePlayerSelected.playerName} added!\n\nPaying: Back 9 + Back 9 Greenies (holes 12 & 17)\nOnly back 9 scores count toward team.`);
                                                                }}
                                                                style={{
                                                                    padding: '15px',
                                                                    background: '#f39c12',
                                                                    color: 'white',
                                                                    border: 'none',
                                                                    borderRadius: '8px',
                                                                    cursor: 'pointer',
                                                                    fontSize: '15px',
                                                                    fontWeight: '600'
                                                                }}
                                                            >
                                                                💰 Paying Back 9 Only
                                                            </button>
                                                            <div style={{fontSize: '11px', color: '#888', textAlign: 'center', marginTop: '-5px'}}>
                                                                Only back 9 scores count + pays 2 back 9 greenies
                                                            </div>
                                                            
                                                            {par3sRemainingCount > 0 && (
                                                                <>
                                                                    <button
                                                                        onClick={() => {
                                                                            setLatePlayerPayment('greenies_only');
                                                                            setLatePlayerStep(3);
                                                                        }}
                                                                        style={{
                                                                            padding: '15px',
                                                                            background: '#9b59b6',
                                                                            color: 'white',
                                                                            border: 'none',
                                                                            borderRadius: '8px',
                                                                            cursor: 'pointer',
                                                                            fontSize: '15px',
                                                                            fontWeight: '600'
                                                                        }}
                                                                    >
                                                                        ⛳ Greenies Only (No 9s)
                                                                    </button>
                                                                    <div style={{fontSize: '11px', color: '#888', textAlign: 'center', marginTop: '-5px'}}>
                                                                        Not paying for front or back, but opt-in for {par3sRemainingCount} remaining greenie{par3sRemainingCount > 1 ? 's' : ''}
                                                                    </div>
                                                                </>
                                                            )}
                                                            
                                                            <button
                                                                onClick={() => {
                                                                    addPlayerToTeamLate(addLatePlayerTeamId, latePlayerSelected.playerId, 'none', []);
                                                                    setShowAddLatePlayer(false);
                                                                    setAddLatePlayerTeamId(null);
                                                                    setLatePlayerSelected(null);
                                                                    setLatePlayerStep(1);
                                                                    setLatePlayerPayment(null);
                                                                    alert(`${latePlayerSelected.playerName} added!\n\nNot paying for 9s or greenies.\nScores don't count toward team.`);
                                                                }}
                                                                style={{
                                                                    padding: '15px',
                                                                    background: '#e74c3c',
                                                                    color: 'white',
                                                                    border: 'none',
                                                                    borderRadius: '8px',
                                                                    cursor: 'pointer',
                                                                    fontSize: '15px',
                                                                    fontWeight: '600'
                                                                }}
                                                            >
                                                                🚫 Not Paying (No 9s, No Greenies)
                                                            </button>
                                                            <div style={{fontSize: '11px', color: '#888', textAlign: 'center', marginTop: '-5px'}}>
                                                                Just playing for fun, scores don't count
                                                            </div>
                                                            
                                                            <button
                                                                onClick={() => {
                                                                    setLatePlayerSelected(null);
                                                                    setLatePlayerStep(1);
                                                                }}
                                                                style={{
                                                                    padding: '12px',
                                                                    background: '#95a5a6',
                                                                    color: 'white',
                                                                    border: 'none',
                                                                    borderRadius: '8px',
                                                                    cursor: 'pointer',
                                                                    fontSize: '14px'
                                                                }}
                                                            >
                                                                ← Back to Player Selection
                                                            </button>
                                                        </div>
                                                    </>
                                                );
                                            })()}
                                        </div>
                                    ) : latePlayerStep === 3 ? (
                                        <div>
                                            {(() => {
                                                // Calculate remaining par 3s
                                                const par3Holes = [4, 8, 12, 17];
                                                const team = liveRound?.teams.find(t => t.id === addLatePlayerTeamId);
                                                
                                                const holesPlayed = new Set();
                                                team?.players.forEach(p => {
                                                    Object.keys(p.scores || {}).forEach(hole => {
                                                        const score = p.scores[hole];
                                                        if (score !== undefined && score !== null && score !== '' && score !== 'X') {
                                                            holesPlayed.add(parseInt(hole));
                                                        }
                                                    });
                                                });
                                                
                                                const par3sRemaining = par3Holes.filter(h => !holesPlayed.has(h));
                                                const par3sRemainingCount = par3sRemaining.length;
                                                
                                                return (
                                                    <>
                                                        <div style={{fontWeight: '600', marginBottom: '15px'}}>
                                                            Step 4: Greenie Confirmation for {latePlayerSelected?.playerName}
                                                        </div>
                                                        
                                                        <div style={{
                                                            background: '#e8f5e9',
                                                            border: '1px solid #27ae60',
                                                            borderRadius: '8px',
                                                            padding: '15px',
                                                            marginBottom: '15px'
                                                        }}>
                                                            <div style={{fontWeight: '600', marginBottom: '10px'}}>⛳ Remaining Par 3s:</div>
                                                            <div style={{display: 'flex', flexWrap: 'wrap', gap: '8px'}}>
                                                                {par3sRemaining.map(hole => (
                                                                    <span key={hole} style={{
                                                                        background: '#27ae60',
                                                                        color: 'white',
                                                                        padding: '4px 12px',
                                                                        borderRadius: '15px',
                                                                        fontSize: '14px',
                                                                        fontWeight: '600'
                                                                    }}>
                                                                        Hole {hole}
                                                                    </span>
                                                                ))}
                                                            </div>
                                                            <div style={{marginTop: '10px', fontSize: '14px'}}>
                                                                <strong>{par3sRemainingCount} greenie{par3sRemainingCount > 1 ? 's' : ''}</strong> remaining to play
                                                            </div>
                                                        </div>
                                                        
                                                        <div style={{display: 'flex', flexDirection: 'column', gap: '10px'}}>
                                                            <button
                                                                onClick={() => {
                                                                    addPlayerToTeamLate(addLatePlayerTeamId, latePlayerSelected.playerId, 'none', par3sRemaining);
                                                                    setShowAddLatePlayer(false);
                                                                    setAddLatePlayerTeamId(null);
                                                                    setLatePlayerSelected(null);
                                                                    setLatePlayerStep(1);
                                                                    setLatePlayerPayment(null);
                                                                    alert(`${latePlayerSelected.playerName} added!\n\nPaying: ${par3sRemainingCount} Greenies Only (holes ${par3sRemaining.join(', ')})\nScores don't count toward team 9s.`);
                                                                }}
                                                                style={{
                                                                    padding: '15px',
                                                                    background: '#27ae60',
                                                                    color: 'white',
                                                                    border: 'none',
                                                                    borderRadius: '8px',
                                                                    cursor: 'pointer',
                                                                    fontSize: '15px',
                                                                    fontWeight: '600'
                                                                }}
                                                            >
                                                                ✓ Confirm: Paying for {par3sRemainingCount} Greenie{par3sRemainingCount > 1 ? 's' : ''} (holes {par3sRemaining.join(', ')})
                                                            </button>
                                                            
                                                            <button
                                                                onClick={() => setLatePlayerStep(2)}
                                                                style={{
                                                                    padding: '12px',
                                                                    background: '#95a5a6',
                                                                    color: 'white',
                                                                    border: 'none',
                                                                    borderRadius: '8px',
                                                                    cursor: 'pointer',
                                                                    fontSize: '14px'
                                                                }}
                                                            >
                                                                ← Back to Payment Options
                                                            </button>
                                                        </div>
                                                    </>
                                                );
                                            })()}
                                        </div>
                                    ) : null}
                                    
                                    <div style={{marginTop: '20px', fontSize: '12px', color: '#666', fontStyle: 'italic'}}>
                                        Note: Late joiners' incomplete rounds won't count toward their personal stats/handicap.
                                    </div>
                                    
                                    <button
                                        onClick={() => {
                                            setShowAddLatePlayer(false);
                                            setAddLatePlayerTeamId(null);
                                            setLatePlayerSelected(null);
                                            setLatePlayerStep(1);
                                            setLatePlayerPayment(null);
                                        }}
                                        style={{
                                            marginTop: '15px',
                                            padding: '10px 20px',
                                            background: '#e74c3c',
                                            color: 'white',
                                            border: 'none',
                                            borderRadius: '6px',
                                            cursor: 'pointer',
                                            width: '100%'
                                        }}
                                    >
                                        Cancel
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* Custom Score Keypad Modal */}
                    {activeScoreInput && (
                        <div style={{
                            position: 'fixed',
                            top: 0,
                            left: 0,
                            right: 0,
                            bottom: 0,
                            background: 'rgba(0,0,0,0.7)',
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center',
                            zIndex: 2000
                        }}>
                            <div style={{
                                background: 'white',
                                padding: '20px',
                                borderRadius: '15px',
                                width: '90%',
                                maxWidth: '320px',
                                boxShadow: '0 10px 40px rgba(0,0,0,0.3)'
                            }}>
                                {/* Header */}
                                <div style={{
                                    textAlign: 'center',
                                    marginBottom: '15px',
                                    paddingBottom: '10px',
                                    borderBottom: '2px solid #e0e0e0'
                                }}>
                                    <div style={{fontWeight: 'bold', fontSize: '16px', color: '#27ae60'}}>
                                        {activeScoreInput.playerName}
                                    </div>
                                    <div style={{fontSize: '14px', color: '#666'}}>
                                        Hole {activeScoreInput.hole}
                                    </div>
                                </div>
                                
                                {/* Display */}
                                <div style={{
                                    background: '#f8f9fa',
                                    padding: '15px',
                                    borderRadius: '10px',
                                    textAlign: 'center',
                                    fontSize: '36px',
                                    fontWeight: 'bold',
                                    marginBottom: '15px',
                                    minHeight: '60px',
                                    display: 'flex',
                                    alignItems: 'center',
                                    justifyContent: 'center',
                                    border: '2px solid #e0e0e0'
                                }}>
                                    {keypadValue || '-'}
                                </div>
                                
                                {/* Keypad */}
                                <div style={{
                                    display: 'grid',
                                    gridTemplateColumns: 'repeat(3, 1fr)',
                                    gap: '8px',
                                    marginBottom: '15px'
                                }}>
                                    {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(num => (
                                        <button
                                            key={num}
                                            onClick={() => handleKeypadPress(num.toString())}
                                            style={{
                                                padding: '18px',
                                                fontSize: '24px',
                                                fontWeight: 'bold',
                                                background: 'linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%)',
                                                border: '2px solid #dee2e6',
                                                borderRadius: '10px',
                                                cursor: 'pointer'
                                            }}
                                        >
                                            {num}
                                        </button>
                                    ))}
                                    <button
                                        onClick={() => handleKeypadPress('X')}
                                        style={{
                                            padding: '18px',
                                            fontSize: '24px',
                                            fontWeight: 'bold',
                                            background: 'linear-gradient(135deg, #e74c3c 0%, #c0392b 100%)',
                                            color: 'white',
                                            border: 'none',
                                            borderRadius: '10px',
                                            cursor: 'pointer'
                                        }}
                                    >
                                        X
                                    </button>
                                    <button
                                        onClick={() => handleKeypadPress('0')}
                                        style={{
                                            padding: '18px',
                                            fontSize: '24px',
                                            fontWeight: 'bold',
                                            background: 'linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%)',
                                            border: '2px solid #dee2e6',
                                            borderRadius: '10px',
                                            cursor: 'pointer'
                                        }}
                                    >
                                        0
                                    </button>
                                    <button
                                        onClick={() => handleKeypadPress('backspace')}
                                        style={{
                                            padding: '18px',
                                            fontSize: '20px',
                                            fontWeight: 'bold',
                                            background: 'linear-gradient(135deg, #f39c12 0%, #e67e22 100%)',
                                            color: 'white',
                                            border: 'none',
                                            borderRadius: '10px',
                                            cursor: 'pointer'
                                        }}
                                    >
                                        ⌫
                                    </button>
                                </div>
                                
                                {/* Action Buttons */}
                                <div style={{display: 'flex', gap: '10px'}}>
                                    <button
                                        onClick={closeKeypad}
                                        style={{
                                            flex: 1,
                                            padding: '15px',
                                            fontSize: '16px',
                                            fontWeight: 'bold',
                                            background: '#95a5a6',
                                            color: 'white',
                                            border: 'none',
                                            borderRadius: '10px',
                                            cursor: 'pointer'
                                        }}
                                    >
                                        Cancel
                                    </button>
                                    <button
                                        onClick={() => handleKeypadPress('clear')}
                                        style={{
                                            flex: 1,
                                            padding: '15px',
                                            fontSize: '16px',
                                            fontWeight: 'bold',
                                            background: '#e74c3c',
                                            color: 'white',
                                            border: 'none',
                                            borderRadius: '10px',
                                            cursor: 'pointer'
                                        }}
                                    >
                                        Clear
                                    </button>
                                    <button
                                        onClick={() => handleKeypadPress('done')}
                                        style={{
                                            flex: 2,
                                            padding: '15px',
                                            fontSize: '16px',
                                            fontWeight: 'bold',
                                            background: 'linear-gradient(135deg, #27ae60 0%, #229954 100%)',
                                            color: 'white',
                                            border: 'none',
                                            borderRadius: '10px',
                                            cursor: 'pointer'
                                        }}
                                    >
                                        ✓ Done
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<GunpowderBigBoysGolf />, document.getElementById('root'));
    </script>
</body>
</html>
